on: [push]

jobs:
  myjob:
    environment:
      name: env-name
      url: ${{ steps.thing.outputs.app-url }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@fd80521afbba9a2a76a99ba1acc07aff8d733d11 # v1.5.2
        id: thing
        with:
          app-name: 'my-function-app'
          package: my.zip
